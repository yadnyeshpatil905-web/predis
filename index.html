<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Preparedness Education Platform</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics-compat.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* All existing CSS styles remain exactly the same */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at top, #0a0a2a 0%, #000000 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(76, 201, 240, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(67, 97, 238, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* ... ALL EXISTING CSS STYLES REMAIN EXACTLY AS THEY ARE ... */

        /* Keep all CSS styles from the original code exactly as they were */
        .neon-glow {
            text-shadow: 
                0 0 5px currentColor,
                0 0 10px currentColor,
                0 0 15px currentColor,
                0 0 20px currentColor;
        }

        .glow-effect {
            position: relative;
            z-index: 1;
        }

        .glow-effect::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                #4cc9f0, #4361ee, #3a0ca3, 
                #7209b7, #f72585, #4cc9f0);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
            animation: glow-pulse 3s infinite;
        }

        .glow-effect:hover::before {
            opacity: 0.7;
        }

        .glow-effect:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 10px 20px rgba(76, 201, 240, 0.3),
                0 0 30px rgba(67, 97, 238, 0.4),
                0 0 40px rgba(58, 12, 163, 0.2);
        }

        @keyframes glow-pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .floating {
            animation: float 6s ease-in-out infinite;
        }

        .shimmer-text {
            background: linear-gradient(90deg, 
                #4cc9f0 0%, #ffffff 50%, #4cc9f0 100%);
            background-size: 1000px 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 3s infinite linear;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Notification Styles */
        .notification-badge {
            background: linear-gradient(135deg, #ff4757 0%, #ff2e4d 100%);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .notification-dropdown {
            position: absolute;
            top: 60px;
            right: 20px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(76, 201, 240, 0.3);
            border-radius: 15px;
            width: 350px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .notification-dropdown.show {
            display: block;
        }

        .notification-item {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .notification-item:hover {
            background: rgba(67, 97, 238, 0.1);
        }

        .notification-item.CRITICAL {
            border-left: 4px solid #ff4757;
        }

        .notification-item.HIGH {
            border-left: 4px solid #ffa502;
        }

        .notification-item.MEDIUM {
            border-left: 4px solid #4cc9f0;
        }

        .notification-item.LOW {
            border-left: 4px solid #2ed573;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 15, 30, 0.8);
        }

        .clear-notifications {
            background: transparent;
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff6b81;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .clear-notifications:hover {
            background: rgba(255, 71, 87, 0.1);
        }

        /* Login Page Styles */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(76, 201, 240, 0.1) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            animation: float 20s infinite linear;
        }

        .login-container::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(67, 97, 238, 0.1) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            animation: float 15s infinite linear reverse;
        }

        .login-box {
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            border: 1px solid rgba(76, 201, 240, 0.2);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 100px rgba(76, 201, 240, 0.1);
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 2;
            transition: all 0.5s ease;
        }

        .login-box:hover {
            border-color: rgba(76, 201, 240, 0.4);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 120px rgba(76, 201, 240, 0.15);
        }

        .login-title {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(76, 201, 240, 0.5);
        }

        .login-subtitle {
            text-align: center;
            margin-bottom: 40px;
            color: #a0a0c0;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0d0;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(15, 15, 30, 0.8);
            border: 2px solid rgba(45, 45, 77, 0.5);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            color: #ffffff;
            backdrop-filter: blur(5px);
        }

        .form-input:focus {
            outline: none;
            border-color: #4cc9f0;
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.3);
            background: rgba(15, 15, 30, 0.9);
        }

        .form-input::placeholder {
            color: #666699;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 10px 25px rgba(67, 97, 238, 0.5),
                0 0 30px rgba(67, 97, 238, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                to right,
                transparent 20%,
                rgba(255, 255, 255, 0.3) 50%,
                transparent 80%
            );
            transform: rotate(30deg);
            transition: transform 0.8s;
        }

        .btn:hover::after {
            transform: rotate(30deg) translate(20%, 20%);
        }

        /* Dashboard Header */
        .header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(76, 201, 240, 0.2);
            box-shadow: 
                0 10px 40px rgba(0, 0, 0, 0.3),
                0 0 50px rgba(76, 201, 240, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }

        .header:hover {
            border-color: rgba(76, 201, 240, 0.4);
            box-shadow: 
                0 15px 50px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(76, 201, 240, 0.15);
        }

        .dashboard-title {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #4cc9f0, #7209b7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .user-badge {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-logout {
            padding: 10px 25px;
            background: linear-gradient(135deg, #ff4d6d 0%, #ff2e4d 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-logout:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
        }

        /* Stat Cards */
        .stat-card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(76, 201, 240, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4cc9f0, #4361ee, #3a0ca3);
        }

        .stat-card:hover {
            transform: translateY(-10px);
            border-color: rgba(76, 201, 240, 0.4);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(76, 201, 240, 0.2);
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 15px 0;
            text-shadow: 0 0 20px rgba(76, 201, 240, 0.5);
        }

        /* Disaster Cards */
        .disaster-card {
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.2) 0%, rgba(58, 12, 163, 0.2) 100%);
            backdrop-filter: blur(10px);
            color: white;
            padding: 30px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 1px solid rgba(76, 201, 240, 0.2);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .disaster-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .disaster-card:hover::before {
            opacity: 1;
        }

        .disaster-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(67, 97, 238, 0.4);
            border-color: rgba(76, 201, 240, 0.5);
        }

        .disaster-card h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffffff, #4cc9f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Weather Section */
        .weather-section {
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.9) 0%, rgba(48, 43, 99, 0.9) 100%);
            backdrop-filter: blur(10px);
            color: white;
            padding: 40px;
            border-radius: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.4),
                0 0 60px rgba(76, 201, 240, 0.1);
            position: relative;
            overflow: hidden;
        }

        .weather-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #4cc9f0, #4361ee, #7209b7);
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .weather-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Alert Cards */
        .alert-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            color: #e0e0e0;
            padding: 25px;
            border-radius: 15px;
            border-left: 6px solid;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .alert-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            opacity: 0.7;
        }

        .alert-card.CRITICAL::before {
            background: linear-gradient(90deg, #ff4757, #ff2e4d);
        }

        .alert-card.HIGH::before {
            background: linear-gradient(90deg, #ffa502, #ff9500);
        }

        .alert-card.MEDIUM::before {
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
        }

        .alert-card.LOW::before {
            background: linear-gradient(90deg, #2ed573, #1dd1a1);
        }

        .alert-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        /* Quiz Styles */
        .quiz-container {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(76, 201, 240, 0.3);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(76, 201, 240, 0.2);
        }

        .option {
            padding: 20px 25px;
            background: rgba(15, 15, 30, 0.8);
            border: 2px solid rgba(45, 45, 77, 0.5);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #e0e0e0;
            backdrop-filter: blur(5px);
        }

        .option:hover {
            border-color: #4361ee;
            background: rgba(67, 97, 238, 0.15);
            transform: translateX(10px);
        }

        .option.selected {
            border-color: #4361ee;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.3) 0%, rgba(58, 12, 163, 0.3) 100%);
            color: white;
            box-shadow: 0 0 20px rgba(67, 97, 238, 0.3);
        }

        /* Module Section */
        .module-section {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(76, 201, 240, 0.2);
            transition: all 0.3s ease;
        }

        .module-section:hover {
            border-color: rgba(76, 201, 240, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 15, 30, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #4cc9f0, #4361ee);
            border-radius: 10px;
            border: 2px solid rgba(15, 15, 30, 0.5);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container {
                padding: 20px;
            }
            
            .header {
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }
            
            .dashboard-title {
                font-size: 1.8rem;
            }
            
            .stat-value {
                font-size: 2.8rem;
            }
            
            .notification-dropdown {
                width: 300px;
                right: 10px;
            }
        }

        @media (max-width: 768px) {
            .login-box {
                padding: 30px 25px;
                margin: 20px;
            }
            
            .dashboard-title {
                font-size: 1.6rem;
            }
            
            .stat-value {
                font-size: 2.2rem;
            }
            
            .weather-section,
            .quiz-container,
            .module-section {
                padding: 25px 20px;
            }
            
            .notification-dropdown {
                width: 280px;
                max-height: 350px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .login-title {
                font-size: 2rem;
            }
            
            .btn, .btn-logout {
                padding: 14px;
            }
            
            .notification-dropdown {
                width: 250px;
                right: 5px;
            }
        }

        /* Loading Animation */
        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(76, 201, 240, 0.3);
            border-top-color: #4cc9f0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(76, 201, 240, 0.5);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Particle Background */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(76, 201, 240, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: float-particle 20s infinite linear;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Firebase Configuration
        const firebaseConfig = {

        // Initialize Firebase
        try {

            console.log("Firebase initialized successfully");
        } catch (error) {

        const auth = firebase.auth();

                oscillator.connect(gainNode);

            const [email, setEmail] = useState('');

            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [showRegister, setShowRegister] = useState(false);
            const [name, setName] = useState('');
            const [institution, setInstitution] = useState('');

            const handleFirebaseLogin = async (e) => {
                e.preventDefault();
                setError('');
                setIsLoading(true);

                try {
                    let userCredential;
                    
                    if (showRegister) {
                        // Register new user
                        userCredential = await auth.createUserWithEmailAndPassword(email, password);
                        const user = userCredential.user;
                        
                        // Save user profile to Firestore
                        await FirebaseManager.saveUserProfile(user.uid, {
                            email: email,
                            name: name,
                            institution: institution,
                            role: 'student',
                            createdAt: new Date().toISOString()
                        });
                        
                        // Login with new user
                        onLogin({
                            id: user.uid,
                            email: email,
                            name: name,
                            role: 'student',
                            institution: institution
                        });
                        
                    } else {
                        // Login existing user
                        userCredential = await auth.signInWithEmailAndPassword(email, password);
                        const user = userCredential.user;
                        
                        // Get user profile from Firestore
                        const userProfile = await FirebaseManager.getUserProfile(user.uid);
                        
                        if (userProfile) {
                            onLogin({
                                id: user.uid,
                                email: user.email,
                                name: userProfile.name || user.email.split('@')[0],
                                role: userProfile.role || 'student',
                                institution: userProfile.institution || 'Not specified'
                            });
                        } else {
                            // Create default profile if doesn't exist
                            await FirebaseManager.saveUserProfile(user.uid, {
                                email: user.email,
                                name: user.email.split('@')[0],
                                institution: 'Not specified',
                                role: 'student'
                            });
                            
                            onLogin({
                                id: user.uid,
                                email: user.email,
                                name: user.email.split('@')[0],
                                role: 'student',
                                institution: 'Not specified'
                            });
                        }
                    }
                    
                } catch (error) {
                    console.error('Authentication error:', error);
                    setError(getFirebaseErrorMessage(error.code));
                } finally {
                    setIsLoading(false);
                }
            };

            const getFirebaseErrorMessage = (code) => {
                switch (code) {
                    case 'auth/invalid-email':
                        return 'Invalid email address.';
                    case 'auth/user-disabled':
                        return 'This account has been disabled.';
                    case 'auth/user-not-found':
                        return 'No account found with this email.';
                    case 'auth/wrong-password':
                        return 'Incorrect password.';
                    case 'auth/email-already-in-use':
                        return 'Email already in use.';
                    case 'auth/weak-password':
                        return 'Password should be at least 6 characters.';
                    case 'auth/network-request-failed':
                        return 'Network error. Please check your connection.';
                    default:
                        return 'Authentication failed. Please try again.';
                }
            };

            return (
                <div className="login-container">
                    <ParticleBackground />
                    <div className="login-box glow-effect">
                        <h1 className="login-title neon-glow">
                            <i className="fas fa-shield-alt"></i> Disaster Preparedness Platform
                        </h1>
                        <p className="login-subtitle">
                            {showRegister ? 'Create your account' : 'Empowering students with life-saving knowledge'}
                        </p>
                        
                        {error && (
                            <div style={{
                                background: 'rgba(255, 71, 87, 0.1)',
                                border: '1px solid rgba(255, 71, 87, 0.3)',
                                color: '#ff6b81',
                                padding: '15px',
                                borderRadius: '10px',
                                marginBottom: '20px',
                                textAlign: 'center'
                            }}>
                                <i className="fas fa-exclamation-circle"></i> {error}
                            </div>
                        )}
                        
                        <form onSubmit={handleFirebaseLogin}>
                            {showRegister && (
                                <>
                                    <div className="form-group">
                                        <label className="form-label">
                                            <i className="fas fa-user"></i> Full Name
                                        </label>
                                        <input
                                            type="text"
                                            className="form-input"
                                            value={name}
                                            onChange={(e) => setName(e.target.value)}
                                            placeholder="Enter your full name"
                                            required
                                        />
                                    </div>
                                    
                                    <div className="form-group">
                                        <label className="form-label">
                                            <i className="fas fa-school"></i> Institution
                                        </label>
                                        <input
                                            type="text"
                                            className="form-input"
                                            value={institution}
                                            onChange={(e) => setInstitution(e.target.value)}
                                            placeholder="School/Organization name"
                                            required
                                        />
                                    </div>
                                </>
                            )}
                            
                            <div className="form-group">
                                <label className="form-label">
                                    <i className="fas fa-envelope"></i> Email
                                </label>
                                <input
                                    type="email"
                                    className="form-input"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="Enter your email"
                                    required
                                />
                            </div>
                            
                            <div className="form-group">
                                <label className="form-label">
                                    <i className="fas fa-lock"></i> Password
                                </label>
                                <input
                                    type="password"
                                    className="form-input"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    placeholder="Enter your password"
                                    required
                                    minLength={6}
                                />
                            </div>
                            
                            <button type="submit" className="btn glow-effect" disabled={isLoading}>
                                {isLoading ? (
                                    <span className="loading-spinner"></span>
                                ) : showRegister ? (
                                    <>
                                        <i className="fas fa-user-plus"></i> Register
                                    </>
                                ) : (
                                    <>
                                        <i className="fas fa-sign-in-alt"></i> Login
                                    </>
                                )}
                            </button>
                        </form>
                        
                        <div style={{ textAlign: 'center', marginTop: '20px' }}>
                            <button 
                                onClick={() => setShowRegister(!showRegister)}
                                style={{
                                    background: 'transparent',
                                    border: 'none',
                                    color: '#4cc9f0',
                                    cursor: 'pointer',
                                    fontSize: '14px',
                                    textDecoration: 'underline'
                                }}
                            >
                                {showRegister ? 'Already have an account? Login' : 'New user? Create account'}
                            </button>
                        </div>
                        
                        <div style={{
                            marginTop: '30px',
                            padding: '20px',
                            background: 'rgba(15, 15, 30, 0.6)',
                            borderRadius: '12px',
                            border: '1px solid rgba(76, 201, 240, 0.2)'
                        }}>
                            <h4 style={{ 
                                color: '#4cc9f0', 
                                marginBottom: '15px',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '10px'
                            }}>
                                <i className="fas fa-info-circle"></i> Firebase Authentication
                            </h4>
                            <div style={{ 
                                color: '#a0a0c0',
                                fontSize: '14px'
                            }}>
                                <p>Your data is securely stored in Firebase Cloud Firestore.</p>
                                <p>All quiz results and progress are saved to the cloud.</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Weather Alert Component
        const WeatherAlerts = ({ weatherData, disasterAlerts, loadingWeather, onRefresh }) => {
            // Trigger notifications when alerts change
            useEffect(() => {
                if (disasterAlerts.length > 0 && 'Notification' in window) {
                    disasterAlerts.forEach(alert => {
                        if (alert.severity === 'CRITICAL' || alert.severity === 'HIGH') {
                            NotificationManager.showDisasterAlert(alert);
                        }
                    });
                }
            }, [disasterAlerts]);

            if (!weatherData) {
                return (
                    <div className="weather-section glow-effect">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                            <div>
                                <h2 style={{ margin: 0, display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <i className="fas fa-globe-americas"></i> Local Disaster Risk Assessment
                                </h2>
                                <p style={{ opacity: 0.9, marginTop: '5px' }}>Real-time weather-based disaster prediction for your location</p>
                            </div>
                            <button className="btn-refresh glow-effect" onClick={onRefresh}
                                style={{
                                    padding: '10px 20px',
                                    background: 'linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%)',
                                    color: 'white',
                                    border: 'none',
                                    borderRadius: '12px',
                                    cursor: 'pointer',
                                    fontWeight: '600'
                                }}>
                                {loadingWeather ? (
                                    <span className="loading-spinner"></span>
                                ) : (
                                    <>
                                        <i className="fas fa-location-dot"></i> Check My Area
                                    </>
                                )}
                            </button>
                        </div>
                        <p style={{ opacity: 0.8, textAlign: 'center', padding: '40px 20px' }}>
                            Click the button to analyze weather conditions and get disaster risk alerts for your area.
                        </p>
                    </div>
                );
            }

            const weather = weatherData.current;
            const location = weather.name;
            const temp = weather.main.temp.toFixed(1);
            const humidity = weather.main.humidity;
            const windSpeed = weather.wind.speed.toFixed(1);
            const pressure = weather.main.pressure;
            const condition = weather.weather[0].description;

            return (
                <div className="weather-section glow-effect">
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '30px' }}>
                        <div>
                            <h2 style={{ margin: 0, display: 'flex', alignItems: 'center', gap: '10px' }}>
                                <i className="fas fa-map-marker-alt"></i> {location} - Weather Analysis
                            </h2>
                            <p style={{ opacity: 0.9, marginTop: '5px', textTransform: 'capitalize' }}>
                                <i className="fas fa-cloud"></i> {condition}
                            </p>
                        </div>
                        <button className="btn-refresh glow-effect" onClick={onRefresh}
                            style={{
                                padding: '10px 20px',
                                background: 'linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%)',
                                color: 'white',
                                border: 'none',
                                borderRadius: '12px',
                                cursor: 'pointer',
                                fontWeight: '600'
                            }}>
                            {loadingWeather ? (
                                <span className="loading-spinner"></span>
                            ) : (
                                <>
                                    <i className="fas fa-sync-alt"></i> Refresh
                                </>
                            )}
                        </button>
                    </div>

                    <div style={{ 
                        display: 'grid', 
                        gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', 
                        gap: '20px',
                        marginBottom: '30px'
                    }}>
                        <div className="weather-card glow-effect">
                            <h4 style={{ fontSize: '12px', opacity: 0.8, marginBottom: '5px' }}>
                                <i className="fas fa-thermometer-half"></i> Temperature
                            </h4>
                            <div style={{ fontSize: '28px', fontWeight: 'bold' }}>{temp}°C</div>
                        </div>
                        <div className="weather-card glow-effect">
                            <h4 style={{ fontSize: '12px', opacity: 0.8, marginBottom: '5px' }}>
                                <i className="fas fa-tint"></i> Humidity
                            </h4>
                            <div style={{ fontSize: '28px', fontWeight: 'bold' }}>{humidity}%</div>
                        </div>
                        <div className="weather-card glow-effect">
                            <h4 style={{ fontSize: '12px', opacity: 0.8, marginBottom: '5px' }}>
                                <i className="fas fa-wind"></i> Wind Speed
                            </h4>
                            <div style={{ fontSize: '28px', fontWeight: 'bold' }}>{windSpeed} m/s</div>
                        </div>
                        <div className="weather-card glow-effect">
                            <h4 style={{ fontSize: '12px', opacity: 0.8, marginBottom: '5px' }}>
                                <i className="fas fa-weight-hanging"></i> Pressure
                            </h4>
                            <div style={{ fontSize: '28px', fontWeight: 'bold' }}>{pressure} hPa</div>
                        </div>
                    </div>

                    <div style={{ display: 'grid', gap: '20px' }}>
                        {disasterAlerts.map((alert, index) => (
                            <div key={index} className={`alert-card ${alert.severity} glow-effect`}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '15px', marginBottom: '15px' }}>
                                    <span style={{ fontSize: '32px' }}>{alert.icon}</span>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ fontSize: '20px', fontWeight: 'bold', color: '#ffffff' }}>
                                            {alert.type}
                                        </div>
                                    </div>
                                    <span className={`alert-badge ${alert.severity}`} style={{
                                        display: 'inline-block',
                                        padding: '4px 12px',
                                        borderRadius: '12px',
                                        fontSize: '11px',
                                        fontWeight: 'bold',
                                        background: alert.severity === 'CRITICAL' ? '#ff4757' :
                                                   alert.severity === 'HIGH' ? '#ffa502' :
                                                   alert.severity === 'MEDIUM' ? '#4cc9f0' : '#2ed573',
                                        color: 'white'
                                    }}>
                                        {alert.severity}
                                    </span>
                                </div>
                                <div style={{ color: '#cccccc', marginBottom: '15px', lineHeight: 1.6 }}>
                                    {alert.message}
                                </div>
                                <div style={{ 
                                    background: 'rgba(0,0,0,0.2)', 
                                    padding: '15px',
                                    borderRadius: '8px'
                                }}>
                                    <h5 style={{ 
                                        marginBottom: '10px', 
                                        color: '#ffffff',
                                        display: 'flex',
                                        alignItems: 'center',
                                        gap: '10px'
                                    }}>
                                        <i className="fas fa-clipboard-list"></i> Safety Recommendations
                                    </h5>
                                    <ul style={{ listStyle: 'none', padding: 0 }}>
                                        {alert.recommendations.map((rec, idx) => (
                                            <li key={idx} style={{ 
                                                padding: '5px 0', 
                                                paddingLeft: '20px', 
                                                position: 'relative',
                                                color: '#cccccc'
                                            }}>
                                                <i className="fas fa-chevron-right" style={{
                                                    position: 'absolute',
                                                    left: 0,
                                                    color: '#4cc9f0'
                                                }}></i>
                                                {rec}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Dashboard Component
        const Dashboard = ({ 
            user, 
            onLogout, 
            onViewModule, 
            onStartQuiz, 
            weatherData,
            disasterAlerts,
            loadingWeather,
            onRefreshWeather,
            notifications,
            onClearNotifications,
            onNotificationClick,
            showNotifications,
            setShowNotifications,
            unreadCount,
            userHistory,
            avgScore,
            stats
        }) => {
            const handleNotificationPermission = async () => {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        NotificationManager.showAchievement(
                            'Notifications Enabled',
                            'You will now receive disaster alerts and reminders!'
                        );
                    }
                } else {
                    alert('Your browser does not support notifications.');
                }
            };

            return (
                <div className="container">
                    <ParticleBackground />
                    
                    <NotificationDropdown
                        notifications={notifications}
                        show={showNotifications}
                        onClose={() => setShowNotifications(false)}
                        onClear={onClearNotifications}
                        onNotificationClick={onNotificationClick}
                    />
                    
                    <div className="header glow-effect">
                        <h1 className="dashboard-title">
                            <i className="fas fa-shield-alt shimmer-text"></i> Disaster Preparedness Hub
                        </h1>
                        <div className="user-info">
                            <div className="user-badge glow-effect">
                                <i className="fas fa-user"></i> {user.role.toUpperCase()} - {user.name}
                                {unreadCount > 0 && (
                                    <div className="notification-badge">
                                        {unreadCount}
                                    </div>
                                )}
                            </div>
                            <button 
                                className="btn-logout glow-effect" 
                                onClick={() => setShowNotifications(!showNotifications)}
                                style={{ 
                                    background: 'linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%)',
                                    position: 'relative'
                                }}
                            >
                                <i className="fas fa-bell"></i> Notifications
                            </button>
                            <button className="btn-logout glow-effect" onClick={onLogout}>
                                <i className="fas fa-sign-out-alt"></i> Logout
                            </button>
                        </div>
                    </div>

                    {/* Notification Settings Section */}
                    <div style={{
                        background: 'rgba(26, 26, 46, 0.9)',
                        backdropFilter: 'blur(10px)',
                        padding: '20px',
                        borderRadius: '20px',
                        marginBottom: '30px',
                        border: '1px solid rgba(76, 201, 240, 0.2)',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center'
                    }}>
                        <div>
                            <h3 style={{ color: '#4cc9f0', marginBottom: '5px' }}>
                                <i className="fas fa-bell"></i> Notification Settings
                            </h3>
                            <p style={{ color: '#a0a0c0', fontSize: '14px' }}>
                                Get real-time disaster alerts and quiz reminders
                            </p>
                        </div>
                        <button 
                            className="btn glow-effect" 
                            onClick={handleNotificationPermission}
                            style={{ padding: '12px 25px', fontSize: '14px' }}
                        >
                            <i className="fas fa-bell"></i> Enable Notifications
                        </button>
                    </div>

                    <WeatherAlerts 
                        weatherData={weatherData}
                        disasterAlerts={disasterAlerts}
                        loadingWeather={loadingWeather}
                        onRefresh={onRefreshWeather}
                    />

                    <div style={{ 
                        display: 'grid', 
                        gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', 
                        gap: '25px',
                        marginBottom: '30px'
                    }}>
                        <div className="stat-card glow-effect">
                            <h3 style={{ color: '#b0b0d0', marginBottom: '10px', fontSize: '14px' }}>
                                <i className="fas fa-chart-line"></i> Quizzes Completed
                            </h3>
                            <div className="stat-value">{stats.quizzesCompleted}</div>
                            <div className="stat-label">Total Attempts</div>
                        </div>
                        <div className="stat-card glow-effect">
                            <h3 style={{ color: '#b0b0d0', marginBottom: '10px', fontSize: '14px' }}>
                                <i className="fas fa-star"></i> Average Score
                            </h3>
                            <div className="stat-value">{stats.avgScore}%</div>
                            <div className="stat-label">Overall Performance</div>
                        </div>
                        <div className="stat-card glow-effect">
                            <h3 style={{ color: '#b0b0d0', marginBottom: '10px', fontSize: '14px' }}>
                                <i className="fas fa-book"></i> Modules Available
                            </h3>
                            <div className="stat-value">{DISASTER_TYPES.length}</div>
                            <div className="stat-label">Learning Topics</div>
                        </div>
                    </div>

                    <div style={{
                        background: 'rgba(26, 26, 46, 0.9)',
                        backdropFilter: 'blur(10px)',
                        padding: '30px',
                        borderRadius: '20px',
                        marginBottom: '30px',
                        border: '1px solid rgba(76, 201, 240, 0.2)'
                    }}>
                        <h2 style={{ 
                            color: '#4cc9f0', 
                            marginBottom: '25px',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '15px'
                        }}>
                            <i className="fas fa-graduation-cap shimmer-text"></i> Disaster Learning Modules
                        </h2>
                        <div style={{ 
                            display: 'grid', 
                            gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))',
                            gap: '20px'
                        }}>
                            {DISASTER_TYPES.map((disaster, index) => (
                                <div 
                                    key={index} 
                                    className="disaster-card glow-effect"
                                    onClick={() => onViewModule(disaster)}
                                >
                                    <h3>
                                        <i className="fas fa-exclamation-triangle"></i> {disaster}
                                    </h3>
                                    <p>Learn about {disaster.toLowerCase()} preparedness and response</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div style={{
                        background: 'rgba(26, 26, 46, 0.9)',
                        backdropFilter: 'blur(10px)',
                        padding: '30px',
                        borderRadius: '20px',
                        border: '1px solid rgba(76, 201, 240, 0.2)'
                    }}>
                        <h2 style={{ 
                            color: '#4cc9f0', 
                            marginBottom: '25px',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '15px'
                        }}>
                            <i className="fas fa-history shimmer-text"></i> Quiz History (Firebase)
                        </h2>
                        {userHistory.length > 0 ? (
                            <div style={{ overflowX: 'auto' }}>
                                <table style={{ 
                                    width: '100%', 
                                    borderCollapse: 'collapse',
                                    marginTop: '20px'
                                }}>
                                    <thead>
                                        <tr>
                                            <th style={{ 
                                                background: '#0f0f1e', 
                                                padding: '12px', 
                                                textAlign: 'left',
                                                color: '#b0b0d0'
                                            }}>Disaster Type</th>
                                            <th style={{ 
                                                background: '#0f0f1e', 
                                                padding: '12px', 
                                                textAlign: 'left',
                                                color: '#b0b0d0'
                                            }}>Score</th>
                                            <th style={{ 
                                                background: '#0f0f1e', 
                                                padding: '12px', 
                                                textAlign: 'left',
                                                color: '#b0b0d0'
                                            }}>Percentage</th>
                                            <th style={{ 
                                                background: '#0f0f1e', 
                                                padding: '12px', 
                                                textAlign: 'left',
                                                color: '#b0b0d0'
                                            }}>Date</th>
                                            <th style={{ 
                                                background: '#0f0f1e', 
                                                padding: '12px', 
                                                textAlign: 'left',
                                                color: '#b0b0d0'
                                            }}>Result</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {userHistory.map((quiz, index) => (
                                            <tr key={index} style={{ 
                                                transition: 'all 0.3s ease',
                                                cursor: 'pointer'
                                            }}
                                            onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(67, 97, 238, 0.1)'}
                                            onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
                                                <td style={{ padding: '12px', color: '#e0e0e0' }}>
                                                    <strong>{quiz.disaster}</strong>
                                                </td>
                                                <td style={{ padding: '12px', color: '#e0e0e0' }}>
                                                    {quiz.score}/{quiz.total}
                                                </td>
                                                <td style={{ padding: '12px', color: '#e0e0e0' }}>
                                                    {quiz.percentage}%
                                                </td>
                                                <td style={{ padding: '12px', color: '#e0e0e0' }}>
                                                    {new Date(quiz.date).toLocaleDateString()}
                                                </td>
                                                <td style={{ padding: '12px' }}>
                                                    <span style={{
                                                        display: 'inline-block',
                                                        padding: '5px 10px',
                                                        borderRadius: '20px',
                                                        fontWeight: '600',
                                                        fontSize: '12px',
                                                        background: quiz.percentage >= 70 ? '#4caf50' : 
                                                                 quiz.percentage >= 50 ? '#ff9800' : '#f44336',
                                                        color: 'white'
                                                    }}>
                                                        {quiz.percentage >= 70 ? 'Pass' : 'Need Practice'}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        ) : (
                            <p style={{ 
                                color: '#999', 
                                textAlign: 'center', 
                                padding: '40px',
                                fontSize: '18px'
                            }}>
                                <i className="fas fa-clipboard-question"></i> No quiz attempts yet. Start learning!
                            </p>
                        )}
                    </div>

                    {/* Firebase Status */}
                    <div style={{
                        background: 'rgba(26, 26, 46, 0.9)',
                        backdropFilter: 'blur(10px)',
                        padding: '20px',
                        borderRadius: '20px',
                        marginTop: '30px',
                        border: '1px solid rgba(76, 201, 240, 0.2)',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center'
                    }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <i className="fas fa-database" style={{ color: '#4cc9f0', fontSize: '24px' }}></i>
                            <div>
                                <h4 style={{ color: '#4cc9f0', margin: 0 }}>Firebase Connected</h4>
                                <p style={{ color: '#a0a0c0', fontSize: '12px', margin: 0 }}>
                                    Your data is securely stored in the cloud
                                </p>
                            </div>
                        </div>
                        <div style={{ 
                            padding: '8px 16px',
                            background: 'rgba(76, 201, 240, 0.1)',
                            borderRadius: '20px',
                            color: '#4cc9f0',
                            fontSize: '12px'
                        }}>
                            <i className="fas fa-cloud"></i> Cloud Sync Active
                        </div>
                    </div>
                </div>
            );
        };

        // Module Component
        const DisasterModule = ({ disaster, onBack, onStartQuiz }) => {
            const module = DISASTER_MODULES[disaster];

            return (
                <div className="container">
                    <ParticleBackground />
                    
                    <div className="header glow-effect">
                        <h1 style={{ 
                            color: '#4cc9f0', 
                            display: 'flex',
                            alignItems: 'center',
                            gap: '15px'
                        }}>
                            <i className="fas fa-book-open shimmer-text"></i> {disaster} Preparedness
                        </h1>
                        <button className="btn-logout glow-effect" onClick={onBack}>
                            <i className="fas fa-arrow-left"></i> Back to Dashboard
                        </button>
                    </div>

                    <div style={{
                        background: 'rgba(26, 26, 46, 0.9)',
                        backdropFilter: 'blur(10px)',
                        padding: '40px',
                        borderRadius: '20px',
                        border: '1px solid rgba(76, 201, 240, 0.2)'
                    }}>
                        <div style={{ lineHeight: 1.8 }}>
                            <div className="module-section glow-effect">
                                <h3 style={{ 
                                    color: '#4cc9f0', 
                                    marginBottom: '20px',
                                    fontSize: '22px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '10px'
                                }}>
                                    <i className="fas fa-info-circle"></i> Overview
                                </h3>
                                <p style={{ color: '#cccccc', fontSize: '16px' }}>{module.overview}</p>
                            </div>

                            <div className="module-section glow-effect">
                                <h3 style={{ 
                                    color: '#4cc9f0', 
                                    marginBottom: '20px',
                                    fontSize: '22px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '10px'
                                }}>
                                    <i className="fas fa-search"></i> Causes
                                </h3>
                                <p style={{ color: '#cccccc', fontSize: '16px' }}>{module.causes}</p>
                            </div>

                            <div className="module-section glow-effect">
                                <h3 style={{ 
                                    color: '#4cc9f0', 
                                    marginBottom: '20px',
                                    fontSize: '22px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '10px'
                                }}>
                                    <i className="fas fa-exclamation-triangle"></i> Warning Signs
                                </h3>
                                <p style={{ color: '#cccccc', fontSize: '16px' }}>{module.warnings}</p>
                            </div>

                            <div className="module-section glow-effect">
                                <h3 style={{ 
                                    color: '#4cc9f0', 
                                    marginBottom: '20px',
                                    fontSize: '22px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '10px'
                                }}>
                                    <i className="fas fa-tools"></i> Preparedness Steps
                                </h3>
                                <ul style={{ listStyle: 'none', paddingLeft: 0 }}>
                                    {module.preparedness.map((item, index) => (
                                        <li key={index} style={{ 
                                            padding: '15px 0', 
                                            paddingLeft: '35px', 
                                            position: 'relative',
                                            color: '#cccccc',
                                            fontSize: '16px'
                                        }}>
                                            <i className="fas fa-check" style={{
                                                position: 'absolute',
                                                left: 0,
                                                color: '#4cc9f0',
                                                fontSize: '18px'
                                            }}></i>
                                            {item}
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="module-section glow-effect">
                                <h3 style={{ 
                                    color: '#4cc9f0', 
                                    marginBottom: '20px',
                                    fontSize: '22px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '10px'
                                }}>
                                    <i className="fas fa-first-aid"></i> Emergency Response
                                </h3>
                                <ul style={{ listStyle: 'none', paddingLeft: 0 }}>
                                    {module.response.map((item, index) => (
                                        <li key={index} style={{ 
                                            padding: '15px 0', 
                                            paddingLeft: '35px', 
                                            position: 'relative',
                                            color: '#cccccc',
                                            fontSize: '16px'
                                        }}>
                                            <i className="fas fa-chevron-right" style={{
                                                position: 'absolute',
                                                left: 0,
                                                color: '#4cc9f0',
                                                fontSize: '18px'
                                            }}></i>
                                            {item}
                                        </li>
                                    ))}
                                </ul>
                            </div>

                            <div className="module-section glow-effect">
                                <h3 style={{ 
                                    color: '#4cc9f0', 
                                    marginBottom: '20px',
                                    fontSize: '22px',
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '10px'
                                }}>
                                    <i className="fas fa-shield-alt"></i> Safety Do's and Don'ts
                                </h3>
                                <ul style={{ listStyle: 'none', paddingLeft: 0 }}>
                                    {module.safety.map((item, index) => (
                                        <li key={index} style={{ 
                                            padding: '15px 0', 
                                            paddingLeft: '35px', 
                                            position: 'relative',
                                            color: '#cccccc',
                                            fontSize: '16px'
                                        }}>
                                            <i className={`fas ${item.startsWith('DO:') ? 'fa-check-circle' : 'fa-times-circle'}`} style={{
                                                position: 'absolute',
                                                left: 0,
                                                color: item.startsWith('DO:') ? '#4caf50' : '#f44336',
                                                fontSize: '18px'
                                            }}></i>
                                            {item}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>

                        <div style={{ 
                            display: 'flex', 
                            gap: '20px', 
                            marginTop: '30px',
                            flexWrap: 'wrap'
                        }}>
                            <button 
                                className="btn-secondary glow-effect" 
                                onClick={() => onStartQuiz(disaster)}
                                style={{
                                    padding: '15px 30px',
                                    background: 'linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%)',
                                    color: 'white',
                                    border: 'none',
                                    borderRadius: '12px',
                                    cursor: 'pointer',
                                    fontWeight: '600',
                                    fontSize: '16px'
                                }}
                            >
                                <i className="fas fa-play-circle"></i> Take Quiz on {disaster}
                            </button>
                            <button 
                                className="btn-secondary glow-effect" 
                                onClick={onBack}
                                style={{
                                    padding: '15px 30px',
                                    background: 'rgba(67, 97, 238, 0.2)',
                                    color: '#b0b0d0',
                                    border: '1px solid rgba(76, 201, 240, 0.3)',
                                    borderRadius: '12px',
                                    cursor: 'pointer',
                                    fontWeight: '600',
                                    fontSize: '16px'
                                }}
                            >
                                <i className="fas fa-arrow-left"></i> Back to Dashboard
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Quiz Component
        const Quiz = ({ 
            disaster, 
            questions, 
            selectedAnswers, 
            currentQuestion, 
            timeRemaining,
            onAnswerSelect,
            onNext,
            onPrev,
            onSubmit,
            onBack,
            quizComplete,
            quizScore,
            userId
        }) => {
            if (quizComplete) {
                const score = quizScore.score;
                const total = quizScore.total;
                const percentage = quizScore.percentage;
                const passed = percentage >= 70;

                // Save quiz result to Firebase
                useEffect(() => {
                    const saveQuizResult = async () => {
                        const quizData = {
                            disaster: disaster,
                            score: score,
                            total: total,
                            percentage: percentage,
                            passed: passed,
                            date: new Date().toISOString()
                        };
                        
                        await FirebaseManager.saveQuizResult(userId, quizData);
                        
                        // Show achievement notification
                        if (passed && 'Notification' in window && Notification.permission === 'granted') {
                            NotificationManager.showAchievement(
                                'Quiz Completed!',
                                `You scored ${percentage}% on the ${disaster} quiz!`
                            );
                        }
                    };
                    
                    saveQuizResult();
                }, [passed, percentage, disaster, score, total, userId]);

                return (
                    <div className="container">
                        <ParticleBackground />
                        
                        <div className="quiz-container glow-effect">
                            <div style={{ textAlign: 'center', padding: '40px' }}>
                                <h2 style={{ 
                                    color: '#4cc9f0',
                                    fontSize: '32px',
                                    marginBottom: '20px'
                                }}>
