                                    <i className="fas fa-trophy"></i> Quiz Complete!
                                </h2>
                                
                                <div style={{ 
                                    fontSize: '72px', 
                                    fontWeight: 'bold',
                                    background: passed ? 
                                        'linear-gradient(135deg, #4caf50, #2ecc71)' : 
                                        'linear-gradient(135deg, #ff9800, #ff5722)',
                                    WebkitBackgroundClip: 'text',
                                    backgroundClip: 'text',
                                    color: 'transparent',
                                    margin: '20px 0'
                                }}>
                                    {percentage}%
                                </div>
                                
                                <div style={{ 
                                    fontSize: '24px', 
                                    color: '#ffffff',
                                    marginBottom: '30px'
                                }}>
                                    You scored {score} out of {total}
                                    <br />
                                    <span style={{ 
                                        color: passed ? '#4caf50' : '#ff9800', 
                                        fontWeight: 'bold',
                                        fontSize: '28px'
                                    }}>
                                        {passed ? '✓ PASSED' : '✗ NEEDS IMPROVEMENT'}
                                    </span>
                                </div>

                                <div style={{ 
                                    background: 'rgba(76, 201, 240, 0.1)',
                                    padding: '15px',
                                    borderRadius: '10px',
                                    marginBottom: '20px',
                                    color: '#4cc9f0'
                                }}>
                                    <i className="fas fa-cloud-upload-alt"></i> Result saved to Firebase database
                                </div>

                                <div style={{ textAlign: 'left', marginTop: '30px' }}>
                                    <h3 style={{ 
                                        marginBottom: '20px', 
                                        color: '#4cc9f0',
                                        fontSize: '22px'
                                    }}>
                                        <i className="fas fa-list-check"></i> Answer Review
                                    </h3>
                                    {questions.map((q, index) => {
                                        const userAnswer = selectedAnswers[index];
                                        const isCorrect = userAnswer === q.options[q.correct];
                                        
                                        return (
                                            <div key={index} style={{ 
                                                padding: '20px',
                                                marginBottom: '15px',
                                                borderRadius: '12px',
                                                borderLeft: '6px solid',
                                                borderColor: isCorrect ? '#4caf50' : '#f44336',
                                                background: isCorrect ? 
                                                    'rgba(76, 175, 80, 0.1)' : 
                                                    'rgba(244, 67, 54, 0.1)',
                                                border: '1px solid rgba(255, 255, 255, 0.1)'
                                            }}>
                                                <strong style={{ color: '#ffffff', fontSize: '16px' }}>
                                                    Q{index + 1}: {q.question}
                                                </strong>
                                                <p style={{ marginTop: '10px', fontSize: '14px' }}>
                                                    Your Answer: <strong>{userAnswer || 'Not answered'}</strong>
                                                    {!isCorrect && (
                                                        <>
                                                            <br />
                                                            Correct Answer: <strong style={{ color: '#4caf50' }}>
                                                                {q.options[q.correct]}
                                                            </strong>
                                                        </>
                                                    )}
                                                    {isCorrect && (
                                                        <span style={{ color: '#4caf50', marginLeft: '10px' }}>
                                                            ✓ Correct
                                                        </span>
                                                    )}
                                                </p>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div style={{ 
                                    display: 'flex', 
                                    gap: '20px', 
                                    marginTop: '40px',
                                    justifyContent: 'center',
                                    flexWrap: 'wrap'
                                }}>
                                    <button 
                                        className="btn glow-effect" 
                                        onClick={onBack}
                                        style={{
                                            padding: '15px 40px',
                                            fontSize: '16px'
                                        }}
                                    >
                                        <i className="fas fa-home"></i> Back to Dashboard
                                    </button>
                                    <button 
                                        className="btn-secondary glow-effect" 
                                        onClick={() => window.location.reload()}
                                        style={{
                                            padding: '15px 40px',
                                            background: 'rgba(67, 97, 238, 0.2)',
                                            color: '#b0b0d0',
                                            border: '1px solid rgba(76, 201, 240, 0.3)',
                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            fontWeight: '600',
                                            fontSize: '16px'
                                        }}
                                    >
                                        <i className="fas fa-redo"></i> Retake Quiz
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            const question = questions[currentQuestion];
            const selectedAnswer = selectedAnswers[currentQuestion];

            return (
                <div className="container">
                    <ParticleBackground />
                    
                    <div className="quiz-container glow-effect">
                        <div style={{ 
                            display: 'flex', 
                            justifyContent: 'space-between', 
                            alignItems: 'center',
                            marginBottom: '30px',
                            paddingBottom: '20px',
                            borderBottom: '2px solid rgba(45, 45, 77, 0.5)'
                        }}>
                            <div style={{ 
                                fontSize: '20px', 
                                color: '#4cc9f0', 
                                fontWeight: '600',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '10px'
                            }}>
                                <i className="fas fa-question-circle shimmer-text"></i>
                                Question {currentQuestion + 1} of {questions.length}
                            </div>
                            <div style={{ 
                                background: '#ff4757', 
                                color: 'white', 
                                padding: '12px 25px',
                                borderRadius: '25px',
                                fontWeight: '600',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '10px'
                            }}>
                                <i className="fas fa-clock"></i> {formatTime(timeRemaining)}
                            </div>
                        </div>

                        <div style={{ marginBottom: '30px' }}>
                            <div style={{ 
                                fontSize: '22px', 
                                color: '#ffffff', 
                                marginBottom: '25px',
                                fontWeight: '500',
                                lineHeight: 1.6
                            }}>
                                {question.question}
                            </div>
                            
                            <div style={{ display: 'grid', gap: '15px' }}>
                                {question.shuffledOptions.map((option, index) => {
                                    const isSelected = selectedAnswer === option;
                                    const letter = String.fromCharCode(65 + index);
                                    
                                    return (
                                        <div 
                                            key={index}
                                            className={`option ${isSelected ? 'selected' : ''} glow-effect`}
                                            onClick={() => onAnswerSelect(currentQuestion, option)}
                                        >
                                            <span style={{ 
                                                fontWeight: 'bold', 
                                                marginRight: '15px',
                                                color: isSelected ? '#ffffff' : '#4cc9f0'
                                            }}>
                                                {letter}.
                                            </span>
                                            {option}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div style={{ 
                            display: 'flex', 
                            justifyContent: 'space-between',
                            marginTop: '30px'
                        }}>
                            <button 
                                className="btn-secondary glow-effect" 
                                onClick={onPrev}
                                disabled={currentQuestion === 0}
                                style={{
                                    padding: '12px 30px',
                                    background: currentQuestion === 0 ? 
                                        'rgba(67, 97, 238, 0.1)' : 
                                        'linear-gradient(135deg, rgba(67, 97, 238, 0.3) 0%, rgba(58, 12, 163, 0.3) 100%)',
                                    color: currentQuestion === 0 ? '#666' : '#ffffff',
                                    border: '1px solid rgba(76, 201, 240, 0.3)',
                                    borderRadius: '12px',
                                    cursor: currentQuestion === 0 ? 'not-allowed' : 'pointer',
                                    fontWeight: '600',
                                    opacity: currentQuestion === 0 ? 0.5 : 1
                                }}
                            >
                                <i className="fas fa-arrow-left"></i> Previous
                            </button>
                            
                            <div style={{ display: 'flex', gap: '15px' }}>
                                {currentQuestion < questions.length - 1 ? (
                                    <button 
                                        className="btn-secondary glow-effect" 
                                        onClick={onNext}
                                        style={{
                                            padding: '12px 30px',
                                            background: 'linear-gradient(135deg, rgba(67, 97, 238, 0.3) 0%, rgba(58, 12, 163, 0.3) 100%)',
                                            color: '#ffffff',
                                            border: '1px solid rgba(76, 201, 240, 0.3)',
                                            borderRadius: '12px',
                                            cursor: 'pointer',
                                            fontWeight: '600'
                                        }}
                                    >
                                        Next <i className="fas fa-arrow-right"></i>
                                    </button>
                                ) : (
                                    <button 
                                        className="btn glow-effect" 
                                        onClick={onSubmit}
                                        style={{
                                            padding: '12px 40px'
                                        }}
                                    >
                                        <i className="fas fa-paper-plane"></i> Submit Quiz
                                    </button>
                                )}
                            </div>
                        </div>

                        <div style={{ 
                            marginTop: '20px', 
                            textAlign: 'center',
                            color: '#999'
                        }}>
                            <p>
                                <i className="fas fa-check-circle"></i> Answered: {
                                    selectedAnswers.filter(a => a !== null).length
                                } / {questions.length}
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [currentView, setCurrentView] = useState('login');
            const [selectedDisaster, setSelectedDisaster] = useState(null);
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [selectedAnswers, setSelectedAnswers] = useState([]);
            const [quizComplete, setQuizComplete] = useState(false);
            const [quizScore, setQuizScore] = useState(null);
            const [timeRemaining, setTimeRemaining] = useState(300);
            const [weatherData, setWeatherData] = useState(null);
            const [disasterAlerts, setDisasterAlerts] = useState([]);
            const [loadingWeather, setLoadingWeather] = useState(false);
            const [notifications, setNotifications] = useState([]);
            const [showNotifications, setShowNotifications] = useState(false);
            const [notificationPermission, setNotificationPermission] = useState('default');
            const [userHistory, setUserHistory] = useState([]);
            const [userStats, setUserStats] = useState({
                quizzesCompleted: 0,
                avgScore: 0
            });

            const handleLogin = async (user) => {
                setCurrentUser(user);
                setCurrentView('dashboard');
                
                // Load user data from Firebase
                await loadUserData(user.id);
                
                // Request notification permission
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission().then(permission => {
                        setNotificationPermission(permission);
                        if (permission === 'granted') {
                            NotificationManager.showAchievement(
                                'Welcome!',
                                'You will receive disaster alerts and quiz reminders.'
                            );
                        }
                    });
                }
            };

            const loadUserData = async (userId) => {
                try {
                    // Load quiz history
                    const history = await FirebaseManager.getUserQuizHistory(userId);
                    setUserHistory(history);
                    
                    // Calculate stats
                    const quizzesCompleted = history.length;
                    const avgScore = history.length > 0 
                        ? Math.round(history.reduce((sum, q) => sum + q.percentage, 0) / history.length)
                        : 0;
                    
                    setUserStats({
                        quizzesCompleted,
                        avgScore
                    });
                    
                    // Load notifications
                    const userNotifications = await FirebaseManager.getUserNotifications(userId);
                    setNotifications(userNotifications);
                    
                } catch (error) {
                    console.error('Error loading user data:', error);
                }
            };

            const handleLogout = async () => {
                try {
                    await auth.signOut();
                } catch (error) {
                    console.error('Logout error:', error);
                }
                
                setCurrentUser(null);
                setCurrentView('login');
                setSelectedDisaster(null);
                setQuizQuestions([]);
                setQuizComplete(false);
                setNotifications([]);
                setUserHistory([]);
                setUserStats({ quizzesCompleted: 0, avgScore: 0 });
            };

            const handleViewModule = (disaster) => {
                setSelectedDisaster(disaster);
                setCurrentView('module');
            };

            const handleBackToDashboard = () => {
                setCurrentView('dashboard');
                setSelectedDisaster(null);
                setQuizQuestions([]);
                setQuizComplete(false);
                setQuizScore(null);
            };

            const handleStartQuiz = (disaster) => {
                const questions = QUESTION_BANK[disaster] || [];
                const shuffledQuestions = fisherYatesShuffle(questions).slice(0, Math.min(10, questions.length));
                
                const questionsWithShuffledOptions = shuffledQuestions.map(q => {
                    const shuffledOpts = fisherYatesShuffle(q.options);
                    return {
                        ...q,
                        shuffledOptions: shuffledOpts
                    };
                });
                
                setQuizQuestions(fisherYatesShuffle(questionsWithShuffledOptions));
                setSelectedAnswers(new Array(questionsWithShuffledOptions.length).fill(null));
                setCurrentQuestion(0);
                setQuizComplete(false);
                setTimeRemaining(300);
                setSelectedDisaster(disaster);
                setCurrentView('quiz');
            };

            const handleAnswerSelect = (questionIndex, answer) => {
                const newAnswers = [...selectedAnswers];
                newAnswers[questionIndex] = answer;
                setSelectedAnswers(newAnswers);
            };

            const handleQuizSubmit = () => {
                let score = 0;
                quizQuestions.forEach((q, index) => {
                    if (selectedAnswers[index] === q.options[q.correct]) {
                        score++;
                    }
                });
                
                const percentage = Math.round((score / quizQuestions.length) * 100);
                setQuizScore({
                    score,
                    total: quizQuestions.length,
                    percentage
                });
                setQuizComplete(true);
            };

            const handleRefreshWeather = async () => {
                setLoadingWeather(true);
                
                try {
                    const position = await new Promise((resolve, reject) => {
                        if (!navigator.geolocation) {
                            reject(new Error('Geolocation not supported'));
                        }
                        navigator.geolocation.getCurrentPosition(resolve, reject);
                    });

                    const { latitude, longitude } = position.coords;
                    
                    const weatherResponse = await fetch(
                        `https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${WEATHER_API_KEY}&units=metric`
                    );
                    
                    const weatherData = await weatherResponse.json();
                    
                    // Analyze disaster risk
                    const alerts = analyzeDisasterRisk(weatherData);
                    setDisasterAlerts(alerts);
                    setWeatherData({ current: weatherData });
                    
                    // Save weather data to Firebase
                    if (currentUser) {
                        await FirebaseManager.saveWeatherData(currentUser.id, weatherData, alerts);
                    }
                    
                    // Add to notifications
                    alerts.forEach(alert => {
                        addNotification(alert);
                    });
                    
                } catch (error) {
                    console.error('Error fetching weather:', error);
                    alert('Could not fetch weather data. Please enable location.');
                } finally {
                    setLoadingWeather(false);
                }
            };

            const analyzeDisasterRisk = (currentWeather) => {
                const alerts = [];
                const temp = currentWeather.main.temp;
                const humidity = currentWeather.main.humidity;
                const windSpeed = currentWeather.wind.speed;
                const pressure = currentWeather.main.pressure;
                const rain = currentWeather.rain ? currentWeather.rain['1h'] || 0 : 0;

                // Flood Risk
                if (rain >= DISASTER_THRESHOLDS.flood.rainfall || humidity >= DISASTER_THRESHOLDS.flood.humidity) {
                    const severity = rain >= 100 ? 'CRITICAL' : 'HIGH';
                    alerts.push({
                        type: 'Flood Warning',
                        severity: severity,
                        message: `Heavy rainfall detected (${rain.toFixed(1)}mm). Flood risk ${severity === 'CRITICAL' ? 'critical' : 'high'}.`,
                        icon: '🌊',
                        recommendations: [
                            'Move to higher ground if in flood-prone area',
                            'Avoid walking or driving through flood waters',
                            'Prepare emergency evacuation bag',
                            'Monitor local weather updates'
                        ],
                        timestamp: new Date().toISOString()
                    });
                }

                // Cyclone/Storm Risk
                if (windSpeed >= DISASTER_THRESHOLDS.cyclone.windSpeed) {
                    const severity = windSpeed >= 89 ? 'CRITICAL' : 'HIGH';
                    alerts.push({
                        type: severity === 'CRITICAL' ? 'Cyclone Warning' : 'Storm Alert',
                        severity: severity,
                        message: `High winds detected (${windSpeed.toFixed(1)} m/s). ${severity === 'CRITICAL' ? 'Cyclone conditions possible.' : 'Storm conditions.'}`,
                        icon: '🌀',
                        recommendations: [
                            'Secure outdoor furniture and objects',
                            'Stay indoors away from windows',
                            'Prepare emergency kit with supplies for 3 days',
                            'Charge mobile devices and power banks'
                        ],
                        timestamp: new Date().toISOString()
                    });
                }

                // Heatwave Risk
                if (temp >= DISASTER_THRESHOLDS.heatwave.temperature) {
                    const severity = temp >= 45 ? 'CRITICAL' : 'HIGH';
                    alerts.push({
                        type: 'Heatwave Alert',
                        severity: severity,
                        message: `Extreme heat detected (${temp.toFixed(1)}°C). ${severity === 'CRITICAL' ? 'Dangerous heat levels!' : 'High heat conditions.'}`,
                        icon: '🌡️',
                        recommendations: [
                            'Stay indoors during peak heat hours (11 AM - 4 PM)',
                            'Drink plenty of water every 15-20 minutes',
                            'Wear light-colored, loose-fitting clothing',
                            'Check on elderly neighbors and relatives'
                        ],
                        timestamp: new Date().toISOString()
                    });
                }

                // Heavy Rain Risk
                if (rain >= DISASTER_THRESHOLDS.heavyRain.rainfall && rain < DISASTER_THRESHOLDS.flood.rainfall) {
                    alerts.push({
                        type: 'Heavy Rain Alert',
                        severity: 'MEDIUM',
                        message: `Heavy rainfall (${rain.toFixed(1)}mm). Exercise caution outdoors.`,
                        icon: '🌧️',
                        recommendations: [
                            'Avoid unnecessary travel',
                            'Use headlights while driving',
                            'Watch for slippery surfaces',
                            'Keep drains clear of debris'
                        ],
                        timestamp: new Date().toISOString()
                    });
                }

                if (alerts.length === 0) {
                    alerts.push({
                        type: 'All Clear',
                        severity: 'LOW',
                        message: 'No immediate disaster threats detected. Conditions are normal.',
                        icon: '✅',
                        recommendations: [
                            'Stay prepared with your emergency kit',
                            'Review your family emergency plan',
                            'Keep informed about weather updates',
                            'Practice emergency drills regularly'
                        ],
                        timestamp: new Date().toISOString()
                    });
                }

                return alerts;
            };

            const addNotification = async (alert) => {
                const newNotification = {
                    ...alert,
                    id: Date.now(),
                    read: false
                };
                setNotifications(prev => [newNotification, ...prev]);
                
                // Save to Firebase if user is logged in
                if (currentUser) {
                    await FirebaseManager.saveNotification(currentUser.id, newNotification);
                }
            };

            const clearNotifications = async () => {
                setNotifications([]);
                // In a real app, you would mark all as read in Firebase
            };

            const handleNotificationClick = async (notification) => {
                // Mark as read locally
                setNotifications(prev => 
                    prev.map(n => 
                        n.id === notification.id ? { ...n, read: true } : n
                    )
                );
                
                // Mark as read in Firebase
                if (notification.id && typeof notification.id === 'string') {
                    await FirebaseManager.markNotificationAsRead(notification.id);
                }
                
                // Show alert sound for critical notifications
                if (notification.severity === 'CRITICAL') {
                    playAlertSound();
                }
                setShowNotifications(false);
            };

            const unreadCount = notifications.filter(n => !n.read).length;

            // Firebase auth state listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        // User is signed in
                        const userProfile = await FirebaseManager.getUserProfile(user.uid);
                        
                        if (userProfile) {
                            setCurrentUser({
                                id: user.uid,
                                email: user.email,
                                name: userProfile.name || user.email.split('@')[0],
                                role: userProfile.role || 'student',
                                institution: userProfile.institution || 'Not specified'
                            });
                            setCurrentView('dashboard');
                            await loadUserData(user.uid);
                        }
                    }
                });
                
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                let interval;
                if (currentView === 'quiz' && !quizComplete && timeRemaining > 0) {
                    interval = setInterval(() => {
                        setTimeRemaining(prev => {
                            if (prev <= 1) {
                                handleQuizSubmit();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [currentView, quizComplete]);

            // Periodic reminder notifications
            useEffect(() => {
                if (currentUser && currentView === 'dashboard' && notificationPermission === 'granted') {
                    const reminderInterval = setInterval(() => {
                        const disasters = ['Earthquake', 'Fire', 'Flood', 'Cyclone'];
                        const randomDisaster = disasters[Math.floor(Math.random() * disasters.length)];
                        const reminder = {
                            type: 'Quiz Reminder',
                            severity: 'LOW',
                            message: `Time to test your ${randomDisaster} knowledge!`,
                            icon: '📚',
                            recommendations: ['Take the quiz to reinforce your learning'],
                            timestamp: new Date().toISOString()
                        };
                        addNotification(reminder);
                        NotificationManager.showQuizReminder(randomDisaster);
                    }, 1800000); // Every 30 minutes

                    return () => clearInterval(reminderInterval);
                }
            }, [currentUser, currentView, notificationPermission]);

            return (
                <>
                    {currentView === 'login' ? (
                        <Login onLogin={handleLogin} />
                    ) : currentView === 'dashboard' ? (
                        <Dashboard 
                            user={currentUser}
                            onLogout={handleLogout}
                            onViewModule={handleViewModule}
                            onStartQuiz={handleStartQuiz}
                            weatherData={weatherData}
                            disasterAlerts={disasterAlerts}
                            loadingWeather={loadingWeather}
                            onRefreshWeather={handleRefreshWeather}
                            notifications={notifications}
                            onClearNotifications={clearNotifications}
                            onNotificationClick={handleNotificationClick}
                            showNotifications={showNotifications}
                            setShowNotifications={setShowNotifications}
                            unreadCount={unreadCount}
                            userHistory={userHistory}
                            avgScore={userStats.avgScore}
                            stats={userStats}
                        />
                    ) : currentView === 'module' ? (
                        <DisasterModule 
                            disaster={selectedDisaster}
                            onBack={handleBackToDashboard}
                            onStartQuiz={handleStartQuiz}
                        />
                    ) : currentView === 'quiz' ? (
                        <Quiz 
                            disaster={selectedDisaster}
                            questions={quizQuestions}
                            selectedAnswers={selectedAnswers}
                            currentQuestion={currentQuestion}
                            timeRemaining={timeRemaining}
                            onAnswerSelect={handleAnswerSelect}
                            onNext={() => setCurrentQuestion(prev => prev + 1)}
                            onPrev={() => setCurrentQuestion(prev => prev - 1)}
                            onSubmit={handleQuizSubmit}
                            onBack={handleBackToDashboard}
                            quizComplete={quizComplete}
                            quizScore={quizScore}
                            userId={currentUser?.id}
                        />
                    ) : null}
                </>
            );
        };

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registered');
                });
            });
        }
    </script>
</body>
</html>
